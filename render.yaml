services:
  - type: web
    name: careerforge-platform
    env: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GROQ_API_KEY
        sync: false
      - key: FAST2SMS_API_KEY
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
