version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: careerforge_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: careerforge
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: careerforge_api
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      DATABASE_URL: 'postgresql://postgres:postgres@postgres:5432/careerforge?schema=public'
      JWT_SECRET: 'careerforge_super_secret_jwt_key_2026'
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on:
      - postgres

volumes:
  postgres_data:
